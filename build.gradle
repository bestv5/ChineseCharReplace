import org.jetbrains.changelog.Changelog

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}


plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.1.2'
    id 'org.jetbrains.changelog' version '2.4.0'
}

repositories {
        mavenLocal()
        maven { name "Alibaba" ; url "https://maven.aliyun.com/repository/public" }
        mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.2'
    // 仅测试运行时：让 JUnit3 风格的 LightPlatformCodeInsightFixtureTestCase 在 useJUnitPlatform() 下被发现执行
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.7.2'
}

group 'com.haojiyou'
version '1.8.0-beta1'

// 统一 javac 源码编码为 UTF-8，避免中文 Windows 回退 GBK 导致“不可映射字符”编译错误
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

apply plugin: 'java'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

// gradle-changelog-plugin 扩展配置
changelog {
    version = project.version.toString()
    path = file("$projectDir/docs/CHANGELOG.md").canonicalPath
    groups = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
    keepUnreleasedSection = true
    unreleasedTerm = "[Unreleased]"
    itemPrefix = "-"
}

intellij {
//    version = 'IC-2021.1.3'
    version = 'IC-2020.3'
    pluginName = 'CharAutoReplace'
    // 关闭自动推导，避免 patchPluginXml 依据 IC-2020.3 写入 until-build=203.*
    updateSinceUntilBuild = false

    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    patchPluginXml {
        // 只固定 since-build，不设置 untilBuild，产物 <idea-version> 将不含 until-build（即无兼容上限）
        sinceBuild = '203'
        // changeNotes 为 lazy Property<String>（javap 确认），用 provider 惰性求值
        changeNotes = provider {
            changelog.renderItem(
                changelog.getUnreleased().withHeader(false).withEmptySections(false),
                Changelog.OutputType.HTML)
        }
    }

    buildSearchableOptions {
        enabled = false
    }
}

test {
    useJUnitPlatform()
}



wrapper {
    gradleVersion = '6.8'
}

runIde {
    autoReloadPlugins = true
}

